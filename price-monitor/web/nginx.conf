server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IP asli pengunjung dikirim Nginx Proxy Manager lewat X-Forwarded-For.
    # Percayai header itu hanya dari alamat jaringan internal Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Teruskan /api/* ke container backend. Pakai nama container "pm-api"
    # (bukan "api") supaya tidak tertukar dengan container lain bernama "api"
    # di jaringan Nginx Proxy Manager (mis. aplikasi POS).
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://pm-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # SPA fallback — semua route yang tidak match file balik ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset files (Vite menambahkan hash di nama) — cache panjang
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache lama supaya update langsung kelihatan
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Gzip on the fly
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
